worker_processes  1;

events { worker_connections  1024; }

http {
    sendfile on;
    client_max_body_size 1m;
    map $http_x_forwarded_proto $fe_https { default off; https on; }

    # Basic rate limit for webhook abuse
    limit_req_zone $binary_remote_addr zone=webhook_zone:10m rate=10r/s;

    upstream api_upstream {
        server api:8000;
        keepalive 32;
    }
    
    # Dashboard upstream - comment out if dash service not running
    # upstream dash_upstream {
    #     server dash:8501;
    #     keepalive 16;
    # }

    server {
        listen 80;

        location = /health {
            proxy_pass http://api_upstream/health;
        }

        location /webhook {
            limit_req zone=webhook_zone burst=20 nodelay;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://api_upstream$request_uri;
        }
        
        location /privacy {
            proxy_pass http://api_upstream/privacy;
        }
        
        location /data-deletion {
            proxy_pass http://api_upstream/data-deletion;
        }
        
        # Dashboard with authentication and IP restriction (disabled for now)
        # Uncomment when dash service is working
        # location /dash/ {
        #     # HTTP Basic Authentication
        #     auth_basic "Dashboard Access";
        #     auth_basic_user_file /etc/nginx/.htpasswd;
        #     
        #     # IP allowlist (update allow_dash.conf for production)
        #     include /etc/nginx/allow_dash;
        #     
        #     # Streamlit websocket support
        #     proxy_http_version 1.1;
        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Connection "upgrade";
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     proxy_read_timeout 86400;
        #     proxy_pass http://dash_upstream/;
        # }
    }
}
